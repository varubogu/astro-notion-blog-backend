# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference
# https://containers.dev/guide/dependabot

version: 2
updates:
  # .devcontainer/devcontainer.json (features). No Dockerfile in this repo.
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # Majors stay in their own pull requests.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # package.json + package-lock.json at the repository root (npm, not bun/pnpm/yarn).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      # Majors stay in their own pull requests.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
